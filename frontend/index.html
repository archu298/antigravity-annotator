                setProg(0); setMsg('Running inference...');

                    setImgs(_ => { pH(newImgs); return newImgs; });

                    const dw = Math.round(imgW * scale), dh = Math.round(imgH * scale);
                    cv.width = dw; cv.height = dh;
                    ctx.drawImage(imgEl, 0, 0, dw, dh);
                    if (pts && pts.length > 2) {
                        ctx.beginPath();

                                </div>
                                {worldClasses.trim() && (

                                </button>

                        </div>
                        <div className="grid grid-cols-2 gap-3 mb-3">
                            <div><label className="text-[10px] text-surface-500 flex justify-between mb-1">Confidence <span className="text-surface-300 font-mono">{conf.toFixed(2)}</span></label>
                                <input type="range" min="1" max="99" value={Math.round(conf * 100)} onChange={e => setConf(e.target.value / 100)} className="w-full h-5" /></div>

                                <button key={v} onClick={() => setScope(v)} className={`flex-1 px-2 py-1.5 rounded-lg text-xs font-medium border transition-all ${scope === v ? 'border-accent bg-accent/10 text-white' : 'border-surface-600 text-surface-400 hover:text-white'}`}>{l}</button>)}

                                <span className="text-red-400">Shift+Click</span> = exclude region.{' '}

                            </>)}

                {/* Progress bar */}

        function IMP({ imgs, setImgs, cls, setCls, setCi, pH, onCl }) {
            const [fmt, setFmt] = useState('ultra'); const [prog, setProg] = useState(-1); const [msg, setMsg] = useState('');
            const [preview, setPreview] = useState(null);// {images:[], classes:[], annotations:{}}
            const [files, setFiles] = useState(null); const [mode, setMode] = useState('replace');
            const fr = useRef(null); const dr = useRef(null);
            const fmts = [
                { id: 'ultra', nm: 'Ultralytics YOLO', desc: 'Folder/ZIP with data.yaml + images/ + labels/' },
                { id: 'yolo', nm: 'YOLO TXT', desc: 'Label .txt files + classes.txt (+ optional images)' },
                { id: 'coco', nm: 'COCO JSON', desc: 'COCO format annotations.json (+ optional images)' }
            ];
            const stripExt = n => { const d = n.lastIndexOf('.'); return d > 0 ? n.substring(0, d) : n };
            const baseName = p => { const parts = p.replace(/\\/g, '/').split('/'); return parts[parts.length - 1] };

            // Parse files from folder or ZIP input
            const handleFiles = async (fileList) => {
                setFiles(fileList); setProg(0); setMsg('Reading files...');
                try {
                    let entries = {};// path -> {file, text, blob}
                    // Check if it's a ZIP

            };

            const f2b64FromUrl = (url, w, h) => new Promise(r => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0); r(c.toDataURL('image/jpeg', 0.85)) }; im.onerror = () => r(null); im.src = url });

            const pv = preview; const hasImgs = pv && pv.images.length > 0; const labelCount = pv ? Object.keys(pv.annMap).length : 0;
            const totalAnns = pv ? Object.values(pv.annMap).reduce((s, a) => s + a.length, 0) : 0;

                    <div className="mb-4 p-3 rounded-lg bg-surface-900 border border-surface-700">

        }

        function EXM({ imgs, cls, setImgs, onCl, pid }) {

                if (a.tp === 'pl' && a.pts.length >= 2) { const pts = a.pts.map(([x, y]) => `${(x / iw).toFixed(6)} ${(y / ih).toFixed(6)}`).join(' '); return `${ci} ${pts}` }
                if (a.tp === 'kp' && a.pts.length >= 1) { const kpts = a.pts.map(([x, y, v]) => `${(x / iw).toFixed(6)} ${(y / ih).toFixed(6)} ${v ?? 2}`).join(' '); return `${ci} ${kpts}` } return null
            };
            // Render mask for one image
            const renderMask = (im) => {
                const c = document.createElement('canvas'); c.width = im.w; c.height = im.h; const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
                for (const a of im.an) {

                    const r = ci & 0xff, g = (ci >> 8) & 0xff, b = (ci >> 16) & 0xff; ctx.fillStyle = `rgb(${r},${g},${b})`;
                    if (a.tp === 'bb') { ctx.fillRect(a.x, a.y, a.w, a.h) }

                    // polyline skipped in mask (open path, no fill)

                    im.an.forEach(a => {
                        const catId = (clsMap[a.cid] ?? 0) + 1; const ann = { id: aid++, image_id: idx + 1, category_id: catId, iscrowd: 0 };
                        if (a.tp === 'bb') { ann.bbox = [a.x, a.y, a.w, a.h]; ann.area = a.w * a.h; ann.segmentation = [[a.x, a.y, a.x + a.w, a.y, a.x + a.w, a.y + a.h, a.x, a.y + a.h]] }
                        else if (a.tp === 'pg' && a.pts.length >= 3) { const flat = a.pts.flatMap(([x, y]) => [x, y]); ann.segmentation = [flat]; const xs = a.pts.map(p => p[0]), ys = a.pts.map(p => p[1]); const bx = Math.min(...xs), by = Math.min(...ys), bx2 = Math.max(...xs), by2 = Math.max(...ys); ann.bbox = [bx, by, bx2 - bx, by2 - by]; ann.area = (bx2 - bx) * (by2 - by) }
                        else if (a.tp === 'pl' && a.pts.length >= 2) { const flat = a.pts.flatMap(([x, y]) => [x, y]); ann.segmentation = [flat]; ann.keypoints = flat; const xs = a.pts.map(p => p[0]), ys = a.pts.map(p => p[1]); const bx = Math.min(...xs), by = Math.min(...ys), bx2 = Math.max(...xs), by2 = Math.max(...ys); ann.bbox = [bx, by, bx2 - bx, by2 - by]; ann.area = 0 }
                        else if (a.tp === 'kp' && a.pts.length >= 1) { const vpts = a.pts.filter(([,,v]) => v > 0); const xs = vpts.map(p => p[0]), ys = vpts.map(p => p[1]); const bx = xs.length ? Math.min(...xs) : 0, by = ys.length ? Math.min(...ys) : 0, bx2 = xs.length ? Math.max(...xs) : 0, by2 = ys.length ? Math.max(...ys) : 0; ann.keypoints = a.pts.flatMap(([x, y, v]) => [x, y, v ?? 2]); ann.num_keypoints = a.pts.filter(([,,v]) => v > 0).length; ann.bbox = [bx, by, bx2 - bx, by2 - by]; ann.area = (bx2 - bx) * (by2 - by); ann.segmentation = [] }

            // Fetch an image file from the server as ArrayBuffer for ZIP inclusion
            const fetchImageBlob = async (im) => {

                    } else if ((a.tp === 'pg' || a.tp === 'pl') && a.pts.length >= 2) {
                        const xs = a.pts.map(p => p[0]), ys = a.pts.map(p => p[1]);
                        xmin = Math.round(Math.min(...xs)); ymin = Math.round(Math.min(...ys));
                        xmax = Math.round(Math.max(...xs)); ymax = Math.round(Math.max(...ys));
                    } else if (a.tp === 'kp' && a.pts.length >= 1) {
                        const vpts = a.pts.filter(([,,v]) => v > 0);

        // PROPAGATE ANNOTATIONS MODAL
        function PropModal({ imgs, ci, ca, cls, setImgs, setCi, pH, onCl }) {
            const [count, setCount] = useState(1); const [mode, setMode] = useState('copy'); const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [filterCls, setFilterCls] = useState('all'); const [prog, setProg] = useState(-1);
            const cur = ci >= 0 && ci < imgs.length ? imgs[ci] : null;
            const remaining = imgs.length - ci - 1;
            const maxN = Math.min(count, remaining);
            const filtered = filterCls === 'all' ? ca : ca.filter(a => a.cid === filterCls);

            const doPropagate = () => {
                if (filtered.length === 0) { toast('No annotations to propagate', 'warning'); return }
                if (maxN <= 0) { toast('No images ahead', 'warning'); return }
                setProg(0);
                setImgs(prev => {
                    const next = [...prev];
                    for (let off = 1; off <= maxN; off++) {
                        const ti = ci + off;
                        if (ti >= next.length) break;
                        const copied = filtered.map(a => {
                            const na = { ...clone(a), id: uid() };
                            if (mode === 'copy') {
                                if (na.tp === 'bb') { na.x += offset.x * off; na.y += offset.y * off }
                                else if (na.tp === 'pg') { na.pts = na.pts.map(([x, y]) => [x + offset.x * off, y + offset.y * off]) }
                            }
                            return na;
                        });
                        next[ti] = { ...next[ti], an: [...next[ti].an, ...copied] };
                        setProg(Math.round((off / maxN) * 100));
                    }
                    pH(next); return next;
                });
                toast(`Propagated ${filtered.length} ann × ${maxN} images`, 'success');
                setTimeout(() => { setProg(-1); onCl() }, 800);
            };

            return (<MS t="Propagate Annotations" onCl={onCl} wide>
                <div className="mb-4 p-3 rounded-lg bg-surface-900 border border-surface-700">
                    <div className="text-xs text-surface-400 mb-2">Current image has <span className="text-white font-semibold">{ca.length}</span> annotations. <span className="text-surface-500">{remaining} images ahead.</span></div>
                    {ca.length === 0 && <div className="text-xs text-yellow-500">No annotations on current image to propagate.</div>}
                </div>
                <div className="mb-4">
                    <label className="text-xs text-surface-400 mb-1 block">Filter by class</label>
                    <select value={filterCls} onChange={e => setFilterCls(e.target.value)} className="w-full bg-surface-800 border border-surface-600 rounded px-2 py-1.5 text-xs text-white outline-none focus:border-accent">
                        <option value="all">All classes ({ca.length} annotations)</option>
                        {cls.map(c => { const n = ca.filter(a => a.cid === c.id).length; return n > 0 ? <option key={c.id} value={c.id}>{c.nm} ({n})</option> : null })}
                    </select>
                </div>
                <div className="mb-4">
                    <label className="text-xs text-surface-400 mb-1 block">Number of images to propagate to</label>
                    <div className="flex items-center gap-3">
                        <input type="range" min="1" max={Math.max(remaining, 1)} value={count} onChange={e => setCount(parseInt(e.target.value))} className="flex-1 h-5" />
                        <input className="pf w-16 text-center text-sm py-1" value={count} onChange={e => { const v = parseInt(e.target.value); if (!isNaN(v) && v > 0) setCount(Math.min(v, remaining || 1)) }} />
                    </div>
                    <div className="text-[10px] text-surface-500 mt-1">Will copy {filtered.length} annotation(s) to the next {maxN} image(s)</div>
                </div>
                <div className="mb-4 p-3 rounded-lg bg-surface-900 border border-surface-700">
                    <div className="text-xs text-surface-400 mb-2">Offset per frame (for tracking moving objects)</div>
                    <div className="grid grid-cols-2 gap-3">
                        <div><label className="text-[10px] text-surface-500 mb-0.5 block">X offset (px/frame)</label><input className="pf text-xs py-1" value={offset.x} onChange={e => setOffset({ ...offset, x: parseFloat(e.target.value) || 0 })} /></div>
                        <div><label className="text-[10px] text-surface-500 mb-0.5 block">Y offset (px/frame)</label><input className="pf text-xs py-1" value={offset.y} onChange={e => setOffset({ ...offset, y: parseFloat(e.target.value) || 0 })} /></div>

                </div>

                    <button onClick={onCl} className="px-4 py-2 rounded-lg text-sm text-surface-400 hover:text-white hover:bg-surface-700">Cancel</button>

                </div>
            </MS>)

        function AgentPanel({ pid, imgs, cls, setCls, onCl, onRefresh }) {
            const [description, setDescription] = useState('');
            const [acceptThresh, setAcceptThresh] = useState(0.70);
            const [flagThresh, setFlagThresh] = useState(0.30);
            const [refineWithSam, setRefineWithSam] = useState(false);
            const [scope, setScope] = useState('unannotated');
            const [running, setRunning] = useState(false);
            const [progress, setProgress] = useState(null);
            const [models, setModels] = useState([]);
            const [detModel, setDetModel] = useState('');
            const [samModel, setSamModel] = useState('');
            const [phase, setPhase] = useState('setup');
            const [flaggedImages, setFlaggedImages] = useState([]);
            const [reviewIdx, setReviewIdx] = useState(0);
            const [reviewAction, setReviewAction] = useState({});

            useEffect(() => {
                (async () => {
                    try {
                        const data = await apiFetch('/models');
                        setModels(data.models || []);
                        const worldModel = (data.models || []).find(m => m.type === 'world');
                        const detectModel = (data.models || []).find(m => m.type === 'detect');
                        const samModelFound = (data.models || []).find(m => m.type === 'segment');
                        if (worldModel) setDetModel(worldModel.filename);
                        else if (detectModel) setDetModel(detectModel.filename);
                        if (samModelFound) setSamModel(samModelFound.filename);
                    } catch (e) { console.error('Failed to load models:', e); }
                })();
            }, []);

            const runPipeline = async () => {
                if (!description.trim()) { toast('Describe what objects to find', 'warning'); return; }
                if (!detModel) { toast('Select a detection model', 'warning'); return; }
                setRunning(true);
                setPhase('running');
                try {
                    const result = await apiFetch('/agent/run', {
                        method: 'POST',
                        body: JSON.stringify({
                            project_id: pid,
                            description,
                            accept_threshold: acceptThresh,
                            flag_threshold: flagThresh,
                            refine_with_sam: refineWithSam,
                            scope,
                            detection_model: detModel,
                            sam_model: samModel,
                            detection_conf: 0.10,
                            detection_iou: 0.45
                        })
                    });
                    setProgress(result);
                    setFlaggedImages(result.flagged || []);
                    setPhase('results');
                    toast(`Agent done! ${result.summary.total_annotations} annotations created`, 'success');
                    if (onRefresh) onRefresh();
                } catch (e) {
                    toast('Agent pipeline failed: ' + e.message, 'error');
                    setPhase('setup');
                }
                setRunning(false);
            };

            const handleReviewAction = async (filename, action) => {
                try {
                    await apiFetch(`/agent/accept/${pid}`, {
                        method: 'POST',
                        body: JSON.stringify({ filename, action })
                    });
                    setReviewAction(prev => ({ ...prev, [filename]: action }));
                    toast(action === 'accept_all' ? 'Accepted' : 'Rejected', 'success');
                } catch (e) { toast('Failed: ' + e.message, 'error'); }
            };

            const worldModels = models.filter(m => m.type === 'world');
            const detectModels2 = models.filter(m => m.type !== 'segment');
            const samModels = models.filter(m => m.type === 'segment');
            const s = progress?.summary;

            if (phase === 'running') {
                return (<MS t="Agent Pipeline" onCl={onCl} wide>
                    <div className="flex flex-col items-center justify-center py-12 gap-4">
                        <div className="w-12 h-12 border-4 border-accent border-t-transparent rounded-full animate-spin" />
                        <div className="text-sm text-surface-300">Running agent pipeline...</div>
                        <div className="text-xs text-surface-500 text-center max-w-xs">
                            Detecting <span className="text-white font-mono">{description}</span> across {scope === 'all' ? `${imgs.length} images` : scope === 'unannotated' ? 'unannotated images' : 'selected images'}
                        </div>
                        <div className="text-[10px] text-surface-600">This may take a few minutes for large datasets</div>
                    </div>
                </MS>);
            }

            if (phase === 'results' && progress) {
                return (<MS t="Agent Results" onCl={onCl} wide>
                    {/* Summary grid */}
                    <div className="grid grid-cols-3 gap-2 mb-4">
                        {[
                            ['Processed', s.processed_images, 'text-white'],
                            ['Auto-accepted', s.auto_accepted_annotations, 'text-emerald-400'],
                            ['Flagged', s.flagged_annotations, 'text-yellow-400'],
                            ['No detections', s.no_detection_images, 'text-surface-500'],
                            ['Total annotations', s.total_annotations, 'text-accent'],
                            ['Time', `${s.processing_time_seconds}s`, 'text-surface-300'],
                        ].map(([label, val, col]) => (
                            <div key={label} className="bg-surface-900 rounded-lg p-3 border border-surface-700">
                                <div className={`text-lg font-bold font-mono ${col}`}>{val}</div>
                                <div className="text-[10px] text-surface-500 mt-0.5">{label}</div>
                            </div>
                        ))}
                    </div>

                    {/* Class distribution */}
                    {progress.class_distribution && Object.keys(progress.class_distribution).length > 0 && (
                        <div className="mb-4 p-3 rounded-lg bg-surface-900 border border-surface-700">
                            <div className="text-xs font-medium text-surface-400 mb-2">Class Distribution</div>
                            <div className="flex flex-wrap gap-1.5">
                                {Object.entries(progress.class_distribution).map(([name, count]) => (
                                    <span key={name} className="text-[11px] px-2 py-0.5 rounded-full bg-accent/20 border border-accent/30 text-white">
                                        {name} <span className="text-accent font-bold">{count}</span>
                                    </span>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Flagged images review */}
                    {flaggedImages.length > 0 && (
                        <div className="mb-4 p-3 rounded-lg bg-surface-900 border border-yellow-700/40">
                            <div className="flex items-center justify-between mb-2">
                                <div className="text-xs font-medium text-yellow-400">⚠ {flaggedImages.length} images need review</div>
                                <div className="text-[10px] text-surface-500">{reviewIdx + 1} / {flaggedImages.length}</div>
                            </div>
                            <div className="text-[11px] text-surface-400 mb-3">
                                These images have detections between {Math.round(flagThresh * 100)}%–{Math.round(acceptThresh * 100)}% confidence. Accept or reject them.
                            </div>
                            <div className="max-h-48 overflow-y-auto space-y-1">
                                {flaggedImages.map((fname, i) => {
                                    const acted = reviewAction[fname];
                                    return (
                                        <div key={fname} className={`flex items-center gap-2 px-2 py-1.5 rounded-lg text-[11px] ${acted ? 'opacity-50' : 'bg-surface-800'}`}>
                                            <span className="flex-1 font-mono text-surface-300 truncate">{fname}</span>
                                            {acted ? (
                                                <span className={`text-[10px] px-1.5 py-0.5 rounded ${acted === 'accept_all' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`}>
                                                    {acted === 'accept_all' ? '✓ accepted' : '✕ rejected'}
                                                </span>
                                            ) : (
                                                <div className="flex gap-1">
                                                    <button onClick={() => handleReviewAction(fname, 'accept_all')}
                                                        className="px-2 py-0.5 rounded bg-emerald-600/20 border border-emerald-600/30 text-emerald-300 hover:bg-emerald-600/40 transition-colors">✓ Accept</button>
                                                    <button onClick={() => handleReviewAction(fname, 'reject_all')}
                                                        className="px-2 py-0.5 rounded bg-red-600/20 border border-red-600/30 text-red-300 hover:bg-red-600/40 transition-colors">✕ Reject</button>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                            <div className="flex gap-2 mt-3">
                                <button onClick={() => flaggedImages.forEach(f => { if (!reviewAction[f]) handleReviewAction(f, 'accept_all'); })}
                                    className="flex-1 px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600/20 border border-emerald-600/30 text-emerald-300 hover:bg-emerald-600/40 transition-colors">
                                    ✓ Accept All Flagged
                                </button>
                                <button onClick={() => flaggedImages.forEach(f => { if (!reviewAction[f]) handleReviewAction(f, 'reject_all'); })}
                                    className="flex-1 px-3 py-1.5 rounded-lg text-xs font-medium bg-red-600/20 border border-red-600/30 text-red-300 hover:bg-red-600/40 transition-colors">
                                    ✕ Reject All Flagged
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="flex gap-2 justify-end">
                        <button onClick={() => { setPhase('setup'); setProgress(null); setFlaggedImages([]); setReviewAction({}); }}
                            className="px-4 py-2 rounded-lg text-sm text-surface-400 hover:text-white hover:bg-surface-700">Run Again</button>
                        <button onClick={onCl} className="px-5 py-2 rounded-lg text-sm font-medium bg-accent text-white hover:bg-accent-dark">Done</button>
                    </div>
                </MS>);
            }

            // Phase: setup
            return (<MS t="🤖 Agent Auto-Annotation" onCl={onCl} wide>
                {/* Description */}
                <div className="mb-4 p-3 rounded-lg bg-surface-900 border border-surface-700">
                    <div className="text-xs font-medium text-surface-400 mb-1.5">1. What do you want to detect?</div>
                    <textarea value={description} onChange={e => setDescription(e.target.value)}
                        placeholder="forklifts, pallets, workers with helmets, safety barriers"
                        rows={2}
                        className="pf w-full text-xs resize-none"
                        style={{ fontFamily: 'DM Sans, sans-serif' }}
                    />
                    <div className="text-[10px] text-surface-500 mt-1">Comma-separated descriptions. YOLO-World understands natural language.</div>
                </div>

                {/* Detection model */}
                <div className="mb-4 p-3 rounded-lg bg-surface-900 border border-surface-700">
                    <div className="text-xs font-medium text-surface-400 mb-2">2. Detection Model</div>
                    {detectModels2.length === 0 ? (
                        <div className="text-[11px] text-surface-600 text-center py-2">No models found in models/ folder.</div>
                    ) : detectModels2.map(m => (
                        <div key={m.filename} onClick={() => setDetModel(m.filename)}
                            className={`flex items-center gap-2 px-2.5 py-2 mb-1 rounded-lg border cursor-pointer transition-colors ${detModel === m.filename ? 'bg-accent/10 border-accent/40 text-white' : 'bg-surface-800 border-surface-700 text-surface-300 hover:border-surface-500 hover:text-white'}`}>
                            <div className={`w-2 h-2 rounded-full flex-shrink-0 ${detModel === m.filename ? 'bg-accent' : 'bg-surface-600'}`} />
                            <span className="text-xs flex-1 truncate font-mono">{m.filename}</span>
                            <span className="text-[9px] text-surface-600">{(m.size / 1024 / 1024).toFixed(1)}MB</span>
                            <span className={`text-[9px] px-1.5 py-0.5 rounded ${m.type === 'world' ? 'bg-purple-500/20 text-purple-300' : 'bg-surface-700 text-surface-400'}`}>{m.type}</span>
                        </div>
                    ))}
                </div>

                {/* Confidence thresholds */}
                <div className="mb-4 p-3 rounded-lg bg-surface-900 border border-surface-700">
                    <div className="text-xs font-medium text-surface-400 mb-3">3. Confidence Thresholds</div>
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className="text-[10px] text-surface-500 flex justify-between mb-1">
                                Auto-accept ≥ <span className="text-emerald-400 font-mono">{Math.round(acceptThresh * 100)}%</span>
                            </label>
                            <input type="range" min="50" max="99" value={Math.round(acceptThresh * 100)}
                                onChange={e => setAcceptThresh(e.target.value / 100)} className="w-full h-5" />
                        </div>
                        <div>
                            <label className="text-[10px] text-surface-500 flex justify-between mb-1">
                                Flag for review ≥ <span className="text-yellow-400 font-mono">{Math.round(flagThresh * 100)}%</span>
                            </label>
                            <input type="range" min="5" max="65" value={Math.round(flagThresh * 100)}
                                onChange={e => setFlagThresh(e.target.value / 100)} className="w-full h-5" />
                        </div>
                    </div>
                    <div className="mt-2 flex gap-1 text-[10px]">
                        <span className="px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400">≥{Math.round(acceptThresh * 100)}% auto-accept</span>
                        <span className="px-2 py-0.5 rounded bg-yellow-500/15 text-yellow-400">{Math.round(flagThresh * 100)}–{Math.round(acceptThresh * 100)}% flagged</span>
                        <span className="px-2 py-0.5 rounded bg-surface-700 text-surface-500">&lt;{Math.round(flagThresh * 100)}% discard</span>
                    </div>
                </div>

                {/* Scope */}
                <div className="mb-4 p-3 rounded-lg bg-surface-900 border border-surface-700">
                    <div className="text-xs font-medium text-surface-400 mb-2">4. Scope</div>
                    <div className="flex gap-2">
                        {[['unannotated', 'Unannotated Only'], ['all', 'All Images']].map(([v, l]) => (
                            <button key={v} onClick={() => setScope(v)}
                                className={`flex-1 px-3 py-1.5 rounded-lg text-xs font-medium border transition-all ${scope === v ? 'border-accent bg-accent/10 text-white' : 'border-surface-600 text-surface-400 hover:text-white'}`}>
                                {l}
                            </button>
                        ))}
                    </div>
                </div>

                {/* SAM refinement */}
                {samModels.length > 0 && (
                    <div className="mb-4 p-3 rounded-lg bg-surface-900 border border-surface-700">
                        <div className="flex items-center gap-2 mb-2">
                            <input type="checkbox" id="agentSam" checked={refineWithSam} onChange={e => setRefineWithSam(e.target.checked)} className="accent-accent" />
                            <label htmlFor="agentSam" className="text-xs font-medium text-surface-300 cursor-pointer">
                                Refine flagged detections with SAM (slower, better polygons)
                            </label>
                        </div>
                        {refineWithSam && (
                            <select value={samModel} onChange={e => setSamModel(e.target.value)} className="pf w-full text-xs mt-1">
                                {samModels.map(m => <option key={m.filename} value={m.filename}>{m.filename}</option>)}
                            </select>
                        )}
                    </div>
                )}

                <div className="text-[10px] text-surface-600 mb-4 p-2 rounded bg-surface-900 border border-surface-700">
                    Agent runs YOLO-World at low confidence (10%) on the server to find all candidates, then sorts them by your thresholds. New classes are added to the project automatically.
                </div>

                <div className="flex gap-2 justify-end">
                    <button onClick={onCl} className="px-4 py-2 rounded-lg text-sm text-surface-400 hover:text-white hover:bg-surface-700">Cancel</button>
                    <button onClick={runPipeline} disabled={!description.trim() || !detModel}
                        className={`px-5 py-2 rounded-lg text-sm font-medium text-white transition-colors ${!description.trim() || !detModel ? 'bg-surface-600 cursor-not-allowed' : 'bg-purple-600 hover:bg-purple-700'}`}>
                        🤖 Run Agent
                    </button>
                </div>
            </MS>);
        }

        function MS({ t, onCl, children, wide }) { return (<div className="fixed inset-0 z-50 flex items-center justify-center mo" onClick={onCl}><div className={`bg-surface-800 rounded-xl border border-surface-600 shadow-2xl p-5 ${wide ? 'w-[600px]' : 'w-[440px]'} max-h-[80vh] overflow-y-auto sci`} onClick={e => e.stopPropagation()}><div className="flex items-center justify-between mb-4"><h2 className="text-base font-semibold text-white">{t}</h2><button onClick={onCl} className="p-1 rounded hover:bg-surface-700 text-surface-400 hover:text-white">{I.x({ size: 16 })}</button></div>{children}</div></div>) }

        ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
    </script>
</body>

</html>
